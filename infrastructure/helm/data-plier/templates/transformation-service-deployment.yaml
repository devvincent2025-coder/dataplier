apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transformation-service
  template:
    metadata:
      labels:
        app: transformation-service
    spec:
      containers:
        - name: transformation-service
          image: {{ .Values.transformationService.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.transformationService.port }}
