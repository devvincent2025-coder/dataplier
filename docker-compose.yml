services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dataplier
      POSTGRES_USER: dataplier
      POSTGRES_PASSWORD: dataplier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./database/003-data-systems.sql:/docker-entrypoint-initdb.d/003-data-systems.sql:ro
      - ./database/004-pipeline-builder.sql:/docker-entrypoint-initdb.d/004-pipeline-builder.sql:ro
      - ./database/005-governance.sql:/docker-entrypoint-initdb.d/005-governance.sql:ro
      - ./database/006-enterprise-observability.sql:/docker-entrypoint-initdb.d/006-enterprise-observability.sql:ro
      - ./database/007-observability-delivery.sql:/docker-entrypoint-initdb.d/007-observability-delivery.sql:ro
      - ./database/008-stripe-billing.sql:/docker-entrypoint-initdb.d/008-stripe-billing.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/dataplier

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

  prometheus:
    image: prom/prometheus:v2.53.1
    ports:
      - "9091:9090"
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      - postgres
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: dataplier
      POSTGRES_PWD: dataplier
      POSTGRES_SEEDS: postgres

  api-gateway:
    build: ./api-gateway
    env_file: .env
    environment:
      OBS_INGEST_SECRET: ${OBS_INGEST_SECRET:-local-dev-ingest-key}
    ports:
      - "8080:8080"

  auth-service:
    build: ./services/auth-service
    env_file: .env
    environment:
      METADATA_SERVICE_URL: http://metadata-service:8086
    ports:
      - "8081:8081"

  connection-service:
    build: ./services/connection-service
    env_file: .env
    ports:
      - "8082:8082"

  dataset-service:
    build: ./services/dataset-service
    env_file: .env
    ports:
      - "8083:8083"

  pipeline-service:
    build: ./services/pipeline-service
    depends_on:
      - postgres
      - temporal
      - neo4j
      - job-service
    restart: unless-stopped
    env_file: .env
    environment:
      CHUNK_ENGINE_URL: http://chunk-engine:8090
      TEMPORAL_ADDRESS: temporal:7233
      JOB_SERVICE_URL: http://job-service:8085
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dataplier
    ports:
      - "8084:8084"

  job-service:
    build: ./services/job-service
    depends_on:
      - postgres
    env_file: .env
    environment:
      LINEAGE_SERVICE_URL: http://lineage-service:8088
      OBSERVABILITY_SERVICE_URL: http://observability-service:8087
      OBS_INGEST_SECRET: ${OBS_INGEST_SECRET:-local-dev-ingest-key}
    ports:
      - "8085:8085"

  metadata-service:
    build: ./services/metadata-service
    env_file: .env
    ports:
      - "8086:8086"

  observability-service:
    build: ./services/observability-service
    env_file: .env
    environment:
      OBS_INGEST_SECRET: ${OBS_INGEST_SECRET:-local-dev-ingest-key}
      OBS_WEBHOOK_DEFAULT_SECRET: ${OBS_WEBHOOK_DEFAULT_SECRET:-local-dev-ingest-key}
    ports:
      - "8087:8087"

  lineage-service:
    build: ./services/lineage-service
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dataplier
    ports:
      - "8088:8088"

  chunk-engine:
    build: ./chunk-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CHUNK_TASK_TOPIC: chunk.tasks
    ports:
      - "8090:8090"

  transformation-service:
    build: ./services/transformation-service
    ports:
      - "8091:8091"

  routing-engine:
    build: ./routing-engine
    environment:
      OBSERVABILITY_SERVICE_URL: http://observability-service:8087
      CONNECTION_SERVICE_URL: http://connection-service:8082
    ports:
      - "8092:8092"

  schema-translator:
    build: ./schema-translator
    ports:
      - "8093:8093"

  time-machine:
    build: ./time-machine
    ports:
      - "8094:8094"

  ai-controller:
    build: ./ai-controller
    ports:
      - "8095:8095"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  transfer-worker:
    build: ./workers/transfer-worker
    depends_on:
      - kafka
      - job-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CHUNK_TASK_TOPIC: chunk.tasks
      KAFKA_GROUP_ID: transfer-worker-group
      JOB_SERVICE_URL: http://job-service:8085

volumes:
  postgres_data:
